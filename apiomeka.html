<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>apiOmk – Lire et ajouter items</title>
</head>
<body>
  <h1>Lecture des items</h1>
  <button id="loadItems">Charger les items</button>
  <ul id="itemsList"></ul>

  <h1>Ajouter un item</h1>
  <form id="addItemForm">
    <label>
      Titre :
      <input type="text" name="title" required>
    </label><br>
    <label>
      Description :
      <textarea name="description"></textarea>
    </label><br>
    <button type="submit">Ajouter l’item</button>
  </form>

  <script>
    // Adapter ces valeurs selon ton serveur
    const API_BASE = 'http://localhost/omeka-s/api/items'; 
    const API_KEY = 'eokj9cPklu944ExreabyjuyBok7yfLr3';
    const KEY_CREDENTIAL = "WVOJ1wvbmLicqXC82dHxQ4VGE47chxbo";

    // Fonction pour charger les items
    async function loadItems() {
      const url = `${API_BASE}/items?apikey=${API_KEY}`;
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('Erreur chargement');
        const data = await resp.json();
        const list = document.getElementById('itemsList');
        list.innerHTML = '';
        data.forEach(item => {
          const li = document.createElement('li');
          li.textContent = `#${item.id} – ${item.title || '(sans titre)'}`;
          list.appendChild(li);
        });
      } catch (err) {
        alert('Erreur : ' + err.message);
      }
    }

    // Fonction pour ajouter un item
    async function addItem(event) {
      event.preventDefault();
      const form = event.target;
      const title = form.title.value;
      const description = form.description.value;

      const payload = {
        item: {
          title: title,
          resource_template_id: 1,        // adapter selon ton modèle
          // autres champs si besoin...
          // Exemple pour Omeka S : values : [...]
          values: [
            {
              property_id: 12,             // description property_id
              "@value": description
            }
          ]
        }
      };

      try {
        const resp = await fetch(`${API_BASE}/items?apikey=${API_KEY}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        if (!resp.ok) throw new Error('Erreur ajout item');
        const result = await resp.json();
        alert('Item ajouté avec id : ' + result.id);
        loadItems();  // recharger
      } catch (err) {
        alert('Erreur : ' + err.message);
      }
    }

    document.getElementById('loadItems').addEventListener('click', loadItems);
    document.getElementById('addItemForm').addEventListener('submit', addItem);

    // Charger au démarrage
    // loadItems();
  </script>
</body>
</html>
